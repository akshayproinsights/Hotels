# fly.toml v2 — Fly.io configuration for Hotel Santosh Backend
# FastAPI + Python 3.11 | Singapore region

app = "hotel-santosh-api"
primary_region = "sin"   # Singapore — closest available to India (bom deprecated)
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
