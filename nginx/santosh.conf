# Santosh Palace — Nginx Configuration
# Symlink this to /etc/nginx/sites-enabled/santosh
#   sudo ln -s /root/Hotel_Santosh/nginx/santosh.conf /etc/nginx/sites-enabled/santosh
#   sudo nginx -t && sudo systemctl reload nginx

# Redirect all HTTP → HTTPS first
server {
    if ($host = santosh.snapkhata.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name santosh.snapkhata.com;
    return 301 https://$host$request_uri;
}

# Redirect HTTPS → New Firebase URL (permanent 301)
server {
    listen 443 ssl http2;
    server_name santosh.snapkhata.com;

    # ── TLS ──────────────────────────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/santosh.snapkhata.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/santosh.snapkhata.com/privkey.pem; # managed by Certbot

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Permanent redirect to new Firebase frontend ───────────────────────
    return 301 https://hotelsantosh-9e117.web.app$request_uri;
}
